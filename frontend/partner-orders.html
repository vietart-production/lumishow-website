<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiShow — Tra cứu đơn hàng (đối tác)</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0b0f0d; --panel:#121815; --border:rgba(255,255,255,.1);
    --text:#e6f1ea; --dim:#8fa196; --green:#3ddc84; --red:#ff6b6b; --gold:#fbbb21;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1600px;margin:0 auto;padding:32px 32px 80px;}
  h1{font-size:20px;font-weight:700;margin:0 0 4px;}
  .sub{color:var(--dim);font-size:13px;margin:0 0 28px;}

  /* ---- Gate mật khẩu ---- */
  #gate{max-width:360px;margin:80px auto;padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  #gate h2{font-size:16px;margin:0 0 16px;}
  #gate input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:#0d1310;color:var(--text);font-size:14px;margin-bottom:10px;}
  #gate button{width:100%;padding:11px;border-radius:8px;border:none;background:var(--green);color:#04140b;font-weight:700;font-size:14px;cursor:pointer;}
  #gate button:hover{opacity:.9;}
  #gateError{color:var(--red);font-size:12.5px;min-height:16px;margin-top:4px;}

  /* ---- Bộ lọc ---- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;position:relative;z-index:5;}
  .filters select{padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13.5px;}
  .filters button{padding:9px 16px;border-radius:8px;border:none;background:var(--green);color:#04140b;font-weight:700;font-size:13.5px;cursor:pointer;}

  /* ---- Bộ chọn suất diễn — 72 suất phẳng trong <select> gốc rất khó dò
     (không nhóm, không tìm được). Thay bằng combobox: nút hiện lựa chọn
     hiện tại, mở ra bảng nhóm theo THÁNG, mỗi ngày 1 hàng, mỗi suất giờ là
     1 pill bấm được — suất đang mở bán nổi bật màu xanh, suất đã khoá lùi
     về nền mờ (vẫn bấm được, phục vụ tra cứu quá khứ) nhưng không chiếm
     sự chú ý. Có ô tìm nhanh theo ngày/giờ ở đầu bảng. ---- */
  .st-picker{position:relative;min-width:240px;}
  .st-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-size:13.5px;cursor:pointer;text-align:left;
  }
  .st-btn:hover{border-color:rgba(255,255,255,.22);}
  .st-btn .chev{width:14px;height:14px;flex-shrink:0;color:var(--dim);transition:transform .15s;}
  .st-picker.open .st-btn .chev{transform:rotate(180deg);}
  .st-btn .st-btn-label.placeholder{color:var(--dim);}

  .st-panel{
    position:absolute;top:calc(100% + 6px);left:0;width:min(420px,90vw);max-height:min(480px,70vh);
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;
  }
  .st-search-row{padding:10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
  .st-search{
    width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);
    background:#0d1310;color:var(--text);font-size:13px;
  }
  .st-search:focus{outline:none;border-color:var(--green);}
  .st-list{overflow-y:auto;padding:6px 0;}
  .st-all-row{
    display:block;width:100%;text-align:left;padding:9px 14px;border:none;background:none;
    color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
  }
  .st-all-row:hover,.st-all-row.active{background:rgba(61,220,132,.1);color:var(--green);}
  .st-month{
    padding:12px 14px 6px;font-size:12px;font-weight:700;color:var(--dim);
    border-top:1px solid var(--border);margin-top:4px;
  }
  .st-month:first-of-type{border-top:none;margin-top:0;}
  .st-date-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 14px;}
  .st-date-label{font-size:12.5px;color:var(--text);white-space:nowrap;}
  .st-date-label .dow{color:var(--dim);margin-right:5px;}
  .st-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .st-pill{
    padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
    border:1px solid transparent;white-space:nowrap;
  }
  .st-pill.st-open{background:rgba(61,220,132,.14);color:var(--green);}
  .st-pill.st-open:hover{background:rgba(61,220,132,.26);}
  .st-pill.st-closed{background:transparent;color:var(--dim);border-color:var(--border);opacity:.6;}
  .st-pill.st-closed:hover{opacity:1;}
  .st-pill.active{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset;}
  .st-no-match{padding:24px 14px;text-align:center;color:var(--dim);font-size:13px;}

  /* ---- Bảng ---- */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--panel);}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--text);}
  th.sortable .arrow{display:inline-block;margin-left:4px;opacity:.4;transition:opacity .15s,transform .15s;}
  th.sortable.active .arrow{opacity:1;}
  th.sortable.active.asc .arrow{transform:rotate(180deg);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.03);}
  .status{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .status.PAID{background:rgba(61,220,132,.15);color:var(--green);}
  .status.PENDING_PAYMENT{background:rgba(251,187,33,.15);color:var(--gold);}
  .status.CANCELLED,.status.EXPIRED{background:rgba(255,107,107,.15);color:var(--red);}
  .status.PARTNER_SALE{background:rgba(167,139,250,.16);color:#a78bfa;}
  .amount{font-variant-numeric:tabular-nums;}
  .empty,.loading,.err{padding:40px;text-align:center;color:var(--dim);}
  .err{color:var(--red);}
  .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  #loadMore{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:13px;}
  #loadMore:disabled{opacity:.4;cursor:default;}
  #summary{color:var(--dim);font-size:12.5px;}
  [hidden]{display:none!important;}

  /* ---- Chế độ nhóm theo suất diễn ("Mọi suất diễn") — mỗi ngày 1 bảng
     riêng, tránh trộn lẫn nhiều ngày trong 1 bảng dài gây đọc nhầm ---- */
  .group{margin-bottom:28px;}
  .group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .group-head h2{font-size:15px;font-weight:700;margin:0;}
  .group-head .count{color:var(--dim);font-size:12px;}

  /* ---- Khối Admin (sửa/xoá thẳng vào database) — khoá riêng bằng
     ADMIN_PIN, tách hẳn khỏi mật khẩu đối tác chỉ-đọc ở trên. Ẩn theo mặc
     định, chỉ ai biết PIN mới mở khoá được, và mọi request vẫn được server
     xác thực lại (khoá ở giao diện chỉ để đỡ phải gõ PIN mỗi lần thao tác,
     không phải lớp bảo mật thật). ---- */
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px;}
  .head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .admin-toggle{
    display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;
    border:1px solid var(--border);background:none;color:var(--dim);font-size:12.5px;cursor:pointer;
    flex-shrink:0;
  }
  .admin-toggle:hover{color:var(--text);border-color:rgba(255,255,255,.22);}
  .admin-toggle.unlocked{color:var(--gold);border-color:rgba(251,187,33,.4);background:rgba(251,187,33,.08);}
  .admin-gate-row{display:flex;gap:8px;align-items:center;}
  .admin-gate-row input{padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:#0d1310;color:var(--text);font-size:13px;width:150px;}
  .admin-gate-row button{padding:7px 12px;border-radius:7px;border:none;background:var(--gold);color:#241a02;font-weight:700;font-size:12.5px;cursor:pointer;}
  .admin-gate-err{color:var(--red);font-size:12px;}

  .row-actions{display:flex;gap:6px;}
  .row-actions button{
    padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;
    color:var(--dim);font-size:11.5px;cursor:pointer;white-space:nowrap;
  }
  .row-actions .edit-btn:hover{color:var(--text);border-color:rgba(255,255,255,.25);}
  .row-actions .delete-btn:hover{color:var(--red);border-color:rgba(255,107,107,.4);}

  /* ---- Modal sửa đơn ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;}
  .modal input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:#0d1310;color:var(--text);font-size:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .modal-actions button{padding:9px 16px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;}
  .modal-cancel{background:none;border:1px solid var(--border) !important;color:var(--text);}
  .modal-save{background:var(--green);color:#04140b;}
  .modal-err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px;}

  #downloadBtn{padding:8px 16px;border-radius:20px;border:none;background:var(--green);color:#04140b;font-weight:700;cursor:pointer;font-size:12.5px;flex-shrink:0;}
  #downloadBtn:hover{opacity:.9;}
</style>
</head>
<body>

<div id="gate">
  <h2>Nhập mật khẩu đối tác</h2>
  <input type="password" id="apiKeyInput" placeholder="Mật khẩu / API key" autocomplete="off">
  <button id="gateBtn">Vào xem đơn hàng</button>
  <div id="gateError"></div>
</div>

<div class="wrap" id="app" hidden>
  <div class="head-row">
    <div>
      <h1>Tra cứu đơn hàng — Sơn Thần Thủy Quái</h1>
      <p class="sub">Chỉ đọc — dữ liệu đơn/vé thật, cập nhật theo thời gian thực.</p>
    </div>
    <div class="head-actions">
      <button id="downloadBtn">⬇ Tải Excel (.xlsx)</button>
      <button type="button" class="admin-toggle" id="adminToggle">🔒 Công cụ Admin</button>
      <div class="admin-gate-row" id="adminGateRow" hidden>
        <input type="password" id="adminPinInput" placeholder="PIN admin" autocomplete="off">
        <button type="button" id="adminGateBtn">Mở khoá</button>
      </div>
      <div class="admin-gate-err" id="adminGateErr"></div>
    </div>
  </div>

  <div class="filters">
    <div class="st-picker" id="stPicker">
      <button type="button" class="st-btn" id="stBtn">
        <span class="st-btn-label placeholder" id="stBtnLabel">Mọi suất diễn</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="st-panel" id="stPanel" hidden>
        <div class="st-search-row">
          <input type="text" class="st-search" id="stSearch" placeholder="Tìm theo ngày, thứ hoặc giờ...">
        </div>
        <div class="st-list" id="stList">
          <button type="button" class="st-all-row active" id="stAllRow">Mọi suất diễn</button>
        </div>
      </div>
    </div>
    <select id="fStatus">
      <option value="">Mọi trạng thái</option>
      <option value="PAID">Đã thanh toán</option>
      <option value="PENDING_PAYMENT">Chờ thanh toán</option>
      <option value="CANCELLED">Đã hủy</option>
      <option value="EXPIRED">Hết hạn</option>
    </select>
    <select id="fSource">
      <option value="">Mọi nguồn</option>
      <option value="direct">Khách đặt trực tiếp</option>
      <option value="partner">Bán bởi đối tác</option>
    </select>
    <button id="fApply">Lọc</button>
  </div>

  <div class="table-wrap" id="singleView">
    <table>
      <thead>
        <tr>
          <th>Mã đơn</th>
          <th class="sortable active desc" id="thCreatedAt">Tạo lúc <span class="arrow">▼</span></th>
          <th>Trạng thái</th><th>Khách</th>
          <th>SĐT</th><th>Email</th><th>Ghế</th><th>Tiền</th>
          <th id="thActions" hidden>Thao tác</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>Không có đơn nào khớp bộ lọc.</div>
    <div id="err" class="err" hidden></div>
  </div>

  <div id="groupedView" hidden></div>

  <div id="loading" class="loading">Đang tải...</div>

  <div class="footer-row">
    <span id="summary"></span>
    <button id="loadMore" hidden>Tải thêm</button>
  </div>
</div>

<div class="modal-overlay" id="editModal" hidden>
  <div class="modal">
    <h3>Sửa thông tin khách</h3>
    <label for="editName">Tên khách</label>
    <input type="text" id="editName">
    <label for="editPhone">Số điện thoại</label>
    <input type="text" id="editPhone">
    <label for="editEmail">Email</label>
    <input type="text" id="editEmail">
    <div class="modal-err" id="editErr"></div>
    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="editCancel">Huỷ</button>
      <button type="button" class="modal-save" id="editSave">Lưu</button>
    </div>
  </div>
</div>

<script>
const API_BASE_URL = "https://lumishow-website.onrender.com/api";
const KEY_STORAGE = "lumishow_partner_key";

let apiKey = "";
let cursor = null;
let totalLoaded = 0;
let sortDir = "desc";
let adminUnlocked = false;
let adminPin = "";
let lastLoadedOrders = []; // đơn đang hiển thị (sau lọc) — nguồn cho nút Tải Excel

const gate = document.getElementById("gate");
const app = document.getElementById("app");
const rowsEl = document.getElementById("rows");
const emptyEl = document.getElementById("empty");
const loadingEl = document.getElementById("loading");
const errEl = document.getElementById("err");
const loadMoreBtn = document.getElementById("loadMore");
const summaryEl = document.getElementById("summary");

function fmtVND(n){ return (n || 0).toLocaleString("vi-VN") + "đ"; }
function fmtDate(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function escapeHtml(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const STATUS_LABELS = {
  PAID: "Đã thanh toán",
  PENDING_PAYMENT: "Chờ thanh toán",
  CANCELLED: "Đã hủy",
  EXPIRED: "Hết hạn"
};
function fmtStatus(s){ return STATUS_LABELS[s] || s; }

// Đơn bán buôn cho đối tác (VD lô 218 vé Thủy Quái suất 26/9 16:30, xem
// CLAUDE.md) — vẫn orderStatus:"PAID" thật (không đổi dữ liệu gốc), chỉ hiện
// nhãn riêng "Bán bởi đối tác" thay vì "Đã thanh toán" (bảng lẫn Excel) để
// dễ phân biệt với khách tự đặt vé thật khi đối soát.
const PARTNER_SALE_CUSTOMER_NAME = "Rạp Xiếc Customer";
function isPartnerSale(o){ return o.customerName === PARTNER_SALE_CUSTOMER_NAME; }

// Lọc "Nguồn bán" — tách hẳn khỏi #fStatus (không phải orderStatus thật trên
// Firestore/API, chỉ suy ra từ customerName) nên lọc ở client sau khi API trả
// về, không gửi lên backend.
function currentSourceFilter(){ return document.getElementById("fSource").value; }
function applySourceFilter(orders){
  const f = currentSourceFilter();
  if (!f) return orders;
  return orders.filter(o => f === "partner" ? isPartnerSale(o) : !isPartnerSale(o));
}
function fmtStatusDisplay(o){ return isPartnerSale(o) ? "Bán bởi đối tác" : fmtStatus(o.orderStatus); }

const DOW_NAMES = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
const DOW_SHORT = ["CN","T2","T3","T4","T5","T6","T7"];
function fmtShowtimeLabel(showtimeId){
  const [datePart, timePart] = showtimeId.split("_");
  const [y, m, d] = datePart.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return `${DOW_NAMES[date.getDay()]}, ${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y} · ${timePart}`;
}

// ---- Bộ chọn suất diễn (combobox nhóm theo tháng, thay cho <select> 72
// dòng phẳng rất khó dò) ----
let allShowtimes = [];
let selectedShowtimeId = "";

const stPicker = document.getElementById("stPicker");
const stBtn = document.getElementById("stBtn");
const stBtnLabel = document.getElementById("stBtnLabel");
const stPanel = document.getElementById("stPanel");
const stSearch = document.getElementById("stSearch");
const stList = document.getElementById("stList");
const stAllRow = document.getElementById("stAllRow");

async function loadShowtimes(){
  try {
    const res = await fetch(`${API_BASE_URL}/partner/showtimes/list`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey })
    });
    const data = await res.json();
    if (!res.ok || !data.success) return; // giữ picker rỗng (chỉ "Mọi suất diễn") nếu lỗi, không chặn trang
    allShowtimes = data.showtimes;
    renderShowtimePicker(allShowtimes);
  } catch (e) { /* im lặng — picker vẫn dùng được với "Mọi suất diễn" */ }
}

function renderShowtimePicker(showtimes){
  // Nhóm theo tháng rồi theo ngày — mỗi ngày 1 hàng, mỗi suất giờ trong
  // ngày đó là 1 pill. Suất OPEN nổi bật, CLOSED lùi vào nền mờ nhưng vẫn
  // bấm được (đối tác vẫn cần tra dữ liệu quá khứ).
  const byMonth = new Map();
  showtimes.forEach(st => {
    const [datePart] = st.showtimeId.split("_");
    const [y, m] = datePart.split("-").map(Number);
    const monthKey = `${y}-${String(m).padStart(2,"0")}`;
    if (!byMonth.has(monthKey)) byMonth.set(monthKey, new Map());
    const byDate = byMonth.get(monthKey);
    if (!byDate.has(datePart)) byDate.set(datePart, []);
    byDate.get(datePart).push(st);
  });

  const monthKeys = [...byMonth.keys()].sort();
  let html = "";

  if (monthKeys.length === 0) {
    html = `<div class="st-no-match">Không có suất diễn nào khớp tìm kiếm.</div>`;
  }

  monthKeys.forEach(monthKey => {
    const [y, m] = monthKey.split("-").map(Number);
    html += `<div class="st-month">Tháng ${m}, ${y}</div>`;

    const byDate = byMonth.get(monthKey);
    const dateKeys = [...byDate.keys()].sort();
    dateKeys.forEach(datePart => {
      const [dy, dm, dd] = datePart.split("-").map(Number);
      const dow = DOW_SHORT[new Date(dy, dm - 1, dd).getDay()];
      const pills = byDate.get(datePart)
        .sort((a, b) => a.showtimeId.localeCompare(b.showtimeId))
        .map(st => {
          const time = st.showtimeId.split("_")[1];
          const cls = st.status === "OPEN" ? "st-open" : "st-closed";
          const active = st.showtimeId === selectedShowtimeId ? " active" : "";
          return `<button type="button" class="st-pill ${cls}${active}" data-showtime="${st.showtimeId}">${time}</button>`;
        }).join("");
      html += `<div class="st-date-row">
        <span class="st-date-label"><span class="dow">${dow}</span>${String(dd).padStart(2,"0")}/${String(dm).padStart(2,"0")}</span>
        <span class="st-pills">${pills}</span>
      </div>`;
    });
  });

  stList.innerHTML = html;
  // Hàng "Mọi suất diễn" nằm ngoài phần render động (không bị ghi đè) — chèn lại lên đầu.
  stList.insertBefore(stAllRow, stList.firstChild);
}

function updateStBtnLabel(){
  if (!selectedShowtimeId) {
    stBtnLabel.textContent = "Mọi suất diễn";
    stBtnLabel.classList.add("placeholder");
    stAllRow.classList.add("active");
  } else {
    stBtnLabel.textContent = fmtShowtimeLabel(selectedShowtimeId);
    stBtnLabel.classList.remove("placeholder");
    stAllRow.classList.remove("active");
  }
}

function openStPanel(){
  stPanel.hidden = false;
  stPicker.classList.add("open");
  stSearch.value = "";
  renderShowtimePicker(allShowtimes);
  stSearch.focus();
}
function closeStPanel(){
  stPanel.hidden = true;
  stPicker.classList.remove("open");
}

stBtn.addEventListener("click", () => {
  if (stPanel.hidden) openStPanel(); else closeStPanel();
});
document.addEventListener("click", (e) => {
  if (!stPicker.contains(e.target)) closeStPanel();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeStPanel();
});

stSearch.addEventListener("input", () => {
  const q = stSearch.value.trim().toLowerCase();
  if (!q) { renderShowtimePicker(allShowtimes); return; }
  const filtered = allShowtimes.filter(st => {
    const label = fmtShowtimeLabel(st.showtimeId).toLowerCase();
    return label.includes(q) || st.showtimeId.toLowerCase().includes(q);
  });
  renderShowtimePicker(filtered);
});

stList.addEventListener("click", (e) => {
  const pill = e.target.closest(".st-pill");
  if (pill) {
    selectedShowtimeId = pill.dataset.showtime;
    updateStBtnLabel();
    closeStPanel();
    fetchOrders({ reset: true });
    return;
  }
  if (e.target.closest("#stAllRow")) {
    selectedShowtimeId = "";
    updateStBtnLabel();
    closeStPanel();
    fetchOrders({ reset: true });
  }
});

const singleViewEl = document.getElementById("singleView");
const groupedViewEl = document.getElementById("groupedView");

function currentShowtimeFilter(){
  return selectedShowtimeId;
}

// Chọn "Mọi suất diễn" là chế độ CÓ THỂ trộn nhiều ngày trong 1 đợt tải —
// tải hết rồi tách bảng theo từng suất, tránh nhìn nhầm ngày (feedback thật:
// 1 bảng dài lẫn nhiều ngày dễ đọc sai). Chọn đúng 1 suất thì như cũ, 1 bảng
// phẳng + "Tải thêm" vì mọi dòng vốn đã cùng 1 ngày, không cần tách.
async function fetchOrders({ reset }){
  if (currentShowtimeFilter()) {
    return fetchSingleShowtime({ reset });
  }
  return fetchAllGrouped();
}

async function fetchSingleShowtime({ reset }){
  groupedViewEl.hidden = true;
  singleViewEl.hidden = false;

  if (reset) { cursor = null; rowsEl.innerHTML = ""; totalLoaded = 0; lastLoadedOrders = []; }

  document.getElementById("thActions").hidden = !adminUnlocked;
  loadingEl.hidden = false;
  errEl.hidden = true;
  loadMoreBtn.hidden = true;

  const body = {
    apiKey,
    showtimeId: currentShowtimeFilter(),
    status: document.getElementById("fStatus").value || undefined,
    limit: 50,
    cursor: cursor || undefined,
    sortDir
  };

  try {
    const data = await callOrdersApi(body);
    const orders = applySourceFilter(data.orders);

    orders.forEach(o => rowsEl.insertAdjacentHTML("beforeend", renderRow(o)));
    lastLoadedOrders.push(...orders);
    totalLoaded += orders.length;
    cursor = data.nextCursor;

    emptyEl.hidden = totalLoaded > 0;
    loadMoreBtn.hidden = !cursor;
    const s = summarizeOrders(lastLoadedOrders);
    summaryEl.textContent = totalLoaded > 0
      ? `Đã tải ${totalLoaded} đơn, ${s.customers} khách, ${s.seats} vé, tổng ${fmtVND(s.amount)}`
      : "Đã tải 0 đơn";

  } catch (e) {
    errEl.textContent = e.message;
    errEl.hidden = false;
  } finally {
    loadingEl.hidden = true;
  }
}

// Số trang tối đa khi tự động tải hết (an toàn, tránh vòng lặp chạy mãi nếu
// API trả cursor bất thường) — 40 trang x 50 = 2000 đơn, dư sức cho 1 mùa diễn.
const MAX_AUTO_PAGES = 40;

async function fetchAllGrouped(){
  singleViewEl.hidden = true;
  groupedViewEl.hidden = false;
  loadMoreBtn.hidden = true;

  loadingEl.hidden = false;
  errEl.hidden = true;
  groupedViewEl.innerHTML = "";

  const status = document.getElementById("fStatus").value || undefined;
  const all = [];

  try {
    let pageCursor = undefined;
    for (let page = 0; page < MAX_AUTO_PAGES; page++) {
      const data = await callOrdersApi({ apiKey, status, limit: 50, cursor: pageCursor, sortDir });
      all.push(...data.orders);
      if (!data.nextCursor) break;
      pageCursor = data.nextCursor;
    }

    emptyEl.hidden = true; // empty message chỉ dùng cho bảng đơn — chế độ nhóm tự báo rỗng riêng

    const filtered = applySourceFilter(all);
    lastLoadedOrders = filtered;

    if (filtered.length === 0) {
      groupedViewEl.innerHTML = `<div class="empty">Không có đơn nào khớp bộ lọc.</div>`;
      summaryEl.textContent = "Đã tải 0 đơn";
      return;
    }

    const byShowtime = new Map();
    filtered.forEach(o => {
      const key = o.showtimeId || "(không rõ suất diễn)";
      if (!byShowtime.has(key)) byShowtime.set(key, []);
      byShowtime.get(key).push(o);
    });

    // Sắp theo showtimeId tăng dần (định dạng YYYY-MM-DD_HH:MM nên so chuỗi
    // = so thời gian thật) — luôn 25/9 rồi 26/9 rồi 27/9..., không phụ thuộc
    // sortDir (sortDir chỉ áp trong nội bộ mỗi nhóm).
    const keys = [...byShowtime.keys()].sort((a, b) => a.localeCompare(b));

    keys.forEach(key => {
      const orders = byShowtime.get(key);
      const label = key === "(không rõ suất diễn)" ? key : fmtShowtimeLabel(key);
      const section = document.createElement("div");
      section.className = "group";
      section.innerHTML = `
        <div class="group-head"><h2>${escapeHtml(label)}</h2><span class="count">${orders.length} đơn</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Mã đơn</th><th>Tạo lúc</th><th>Trạng thái</th><th>Khách</th>
              <th>SĐT</th><th>Email</th><th>Ghế</th><th>Tiền</th>
              ${adminUnlocked ? "<th>Thao tác</th>" : ""}
            </tr></thead>
            <tbody>${orders.map(renderRow).join("")}</tbody>
          </table>
        </div>`;
      groupedViewEl.appendChild(section);
    });

    const s = summarizeOrders(filtered);
    summaryEl.textContent = `Đã tải ${filtered.length} đơn, ${keys.length} suất diễn, ${s.customers} khách, ${s.seats} vé, tổng ${fmtVND(s.amount)}`;

  } catch (e) {
    errEl.textContent = e.message;
    errEl.hidden = false;
  } finally {
    loadingEl.hidden = true;
  }
}

async function callOrdersApi(body){
  const res = await fetch(`${API_BASE_URL}/partner/orders/list`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok || !data.success) {
    throw new Error(data.message || "Không tải được dữ liệu");
  }
  return data;
}

// Gộp số liệu tổng hợp cho dòng "Đã tải..." — khách tính theo SĐT (fallback
// tên/email nếu thiếu SĐT) để không đếm trùng khách có nhiều đơn (VD 1 khách
// đặt >6 ghế bị tách nhiều đơn do MAX_SEATS_PER_ORDER).
function summarizeOrders(orders){
  const customers = new Set();
  const showtimes = new Set();
  let seats = 0, amount = 0;

  orders.forEach(o => {
    customers.add((o.customerPhone || o.customerName || o.customerEmail || "").trim().toLowerCase());
    if (o.showtimeId) showtimes.add(o.showtimeId);
    seats += (o.seatIds || []).length;
    amount += o.amount || 0;
  });

  return { customers: customers.size, showtimes: showtimes.size, seats, amount };
}

function renderRow(o){
  const statusClass = isPartnerSale(o) ? "PARTNER_SALE" : escapeHtml(o.orderStatus);
  return `<tr>
    <td>${escapeHtml(o.orderCode)}</td>
    <td>${fmtDate(o.createdAt)}</td>
    <td><span class="status ${statusClass}">${escapeHtml(fmtStatusDisplay(o))}</span></td>
    <td>${escapeHtml(o.customerName)}</td>
    <td>${escapeHtml(o.customerPhone)}</td>
    <td>${escapeHtml(o.customerEmail)}</td>
    <td>${escapeHtml((o.seatIds || []).join(", "))}</td>
    <td class="amount">${fmtVND(o.amount)}</td>
    ${adminUnlocked ? `<td><div class="row-actions">
      <button type="button" class="edit-btn" data-order-id="${escapeHtml(o.orderId)}">Sửa</button>
      <button type="button" class="delete-btn" data-order-id="${escapeHtml(o.orderId)}">Xoá</button>
    </div></td>` : ""}
  </tr>`;
}

document.getElementById("gateBtn").addEventListener("click", tryEnter);
document.getElementById("apiKeyInput").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });

function tryEnter(){
  const val = document.getElementById("apiKeyInput").value.trim();
  if (!val) return;
  apiKey = val;
  gate.hidden = true;
  app.hidden = false;
  loadShowtimes();
  fetchOrders({ reset: true }).then(() => {
    // Chỉ lưu lại key vào phiên trình duyệt SAU KHI xác nhận gọi API thành công
    // (tránh lưu key sai vào sessionStorage nếu người dùng gõ nhầm).
    if (errEl.hidden) {
      try { sessionStorage.setItem(KEY_STORAGE, apiKey); } catch (e) {}
    }
  });
}

document.getElementById("fApply").addEventListener("click", () => fetchOrders({ reset: true }));
loadMoreBtn.addEventListener("click", () => fetchOrders({ reset: false }));

const thCreatedAt = document.getElementById("thCreatedAt");
thCreatedAt.addEventListener("click", () => {
  sortDir = sortDir === "desc" ? "asc" : "desc";
  thCreatedAt.classList.toggle("asc", sortDir === "asc");
  thCreatedAt.classList.toggle("desc", sortDir === "desc");
  thCreatedAt.querySelector(".arrow").textContent = sortDir === "asc" ? "▲" : "▼";
  fetchOrders({ reset: true });
});

// Tự điền lại key đã lưu trong phiên (sessionStorage — mất khi đóng tab,
// không phải localStorage vĩnh viễn) để không phải gõ lại mỗi lần F5.
(function restoreSession(){
  try {
    const saved = sessionStorage.getItem(KEY_STORAGE);
    if (saved) document.getElementById("apiKeyInput").value = saved;
  } catch (e) {}
})();

// ==========================================
// KHỐI ADMIN — mở khoá bằng ADMIN_PIN (khác PARTNER_API_KEY ở trên), cho
// phép Sửa/Xoá thẳng đơn hàng. Mở khoá xong tải lại danh sách hiện tại để
// vẽ thêm cột "Thao tác" cho đồng nhất (đơn giản hơn vá cột vào bảng đang
// có), sau đó Sửa/Xoá chỉ cần render lại đúng phần đã đổi.
// ==========================================

const adminToggle = document.getElementById("adminToggle");
const adminGateRow = document.getElementById("adminGateRow");
const adminPinInput = document.getElementById("adminPinInput");
const adminGateErr = document.getElementById("adminGateErr");

adminToggle.addEventListener("click", () => {
  if (adminUnlocked) return; // đã mở khoá — nút chỉ còn vai trò hiển thị trạng thái
  adminGateRow.hidden = !adminGateRow.hidden;
  if (!adminGateRow.hidden) adminPinInput.focus();
});

async function tryUnlockAdmin(){
  const pin = adminPinInput.value.trim();
  if (!pin) return;
  adminGateErr.textContent = "";
  try {
    const res = await fetch(`${API_BASE_URL}/admin/verify-pin`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pin })
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      adminGateErr.textContent = "Sai PIN admin";
      return;
    }
    adminPin = pin;
    adminUnlocked = true;
    adminGateRow.hidden = true;
    adminToggle.textContent = "🔓 Admin (đã mở khoá)";
    adminToggle.classList.add("unlocked");
    fetchOrders({ reset: true }); // vẽ lại để thêm cột Thao tác
  } catch (e) {
    adminGateErr.textContent = "Không kết nối được máy chủ";
  }
}
document.getElementById("adminGateBtn").addEventListener("click", tryUnlockAdmin);
adminPinInput.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlockAdmin(); });

// ---- Sửa / Xoá đơn — event delegation trên toàn #app vì nút nằm trong cả
// bảng đơn lẻ (#singleView) lẫn nhiều bảng con trong #groupedView ----
document.getElementById("app").addEventListener("click", (e) => {
  const editBtn = e.target.closest(".edit-btn");
  if (editBtn) return openEditModal(editBtn.dataset.orderId);

  const delBtn = e.target.closest(".delete-btn");
  if (delBtn) return handleDeleteOrder(delBtn.dataset.orderId);
});

const editModal = document.getElementById("editModal");
const editErr = document.getElementById("editErr");
let editingOrderId = null;

function openEditModal(orderId){
  const order = lastLoadedOrders.find(o => o.orderId === orderId);
  if (!order) return;
  editingOrderId = orderId;
  document.getElementById("editName").value = order.customerName || "";
  document.getElementById("editPhone").value = order.customerPhone || "";
  document.getElementById("editEmail").value = order.customerEmail || "";
  editErr.textContent = "";
  editModal.hidden = false;
}
function closeEditModal(){ editModal.hidden = true; editingOrderId = null; }

document.getElementById("editCancel").addEventListener("click", closeEditModal);
editModal.addEventListener("click", (e) => { if (e.target === editModal) closeEditModal(); });

document.getElementById("editSave").addEventListener("click", async () => {
  editErr.textContent = "";
  try {
    const res = await fetch(`${API_BASE_URL}/admin/orders/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: adminPin,
        orderId: editingOrderId,
        customerName: document.getElementById("editName").value,
        customerPhone: document.getElementById("editPhone").value,
        customerEmail: document.getElementById("editEmail").value
      })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || "Không thể lưu");
    closeEditModal();
    fetchOrders({ reset: true });
  } catch (e) {
    editErr.textContent = e.message;
  }
});

async function handleDeleteOrder(orderId){
  const order = lastLoadedOrders.find(o => o.orderId === orderId);
  const label = order ? `${order.customerName || "?"} — ${(order.seatIds||[]).join(",")}` : orderId;
  if (!confirm(`Xoá hẳn đơn "${label}"? Không hoàn tác được.`)) return;

  try {
    const res = await fetch(`${API_BASE_URL}/admin/orders/delete`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: adminPin, orderId })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || "Không thể xoá");
    fetchOrders({ reset: true });
  } catch (e) {
    alert(e.message);
  }
}

// ==========================================
// TẢI EXCEL — xuất đúng danh sách đang hiển thị (đã áp bộ lọc) ra file .xlsx
// thật (dùng SheetJS qua CDN, không cần build tool). Header in đậm, đóng
// băng hàng đầu, độ rộng cột tự tính theo nội dung dài nhất, cột tiền định
// dạng số có dấu phẩy.
// ==========================================

document.getElementById("downloadBtn").addEventListener("click", () => {
  if (lastLoadedOrders.length === 0) { alert("Chưa có dữ liệu để tải."); return; }

  const headers = ["Mã đơn","Suất diễn","Tạo lúc","Trạng thái","Khách hàng","SĐT","Email","Ghế","Tiền"];
  const rows = lastLoadedOrders.map(o => [
    o.orderCode, o.showtimeId, fmtDate(o.createdAt), fmtStatusDisplay(o),
    o.customerName, o.customerPhone, o.customerEmail, (o.seatIds||[]).join(", "), o.amount
  ]);

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);

  // Cột tiền là số thật, có dấu phẩy ngăn cách nghìn.
  const amountCol = headers.indexOf("Tiền");
  rows.forEach((_, i) => {
    const cellRef = XLSX.utils.encode_cell({ r: i + 1, c: amountCol });
    if (ws[cellRef]) ws[cellRef].z = "#,##0";
  });

  // Mã đơn / SĐT trông giống số nhưng phải giữ nguyên dạng text (không cho
  // Excel tự suy ra kiểu số rồi hiển thị ký hiệu khoa học 1.789E+15, và SĐT
  // có số 0 đứng đầu sẽ mất nếu bị coi là số).
  ["Mã đơn", "SĐT"].forEach(colName => {
    const col = headers.indexOf(colName);
    rows.forEach((r, i) => {
      const cellRef = XLSX.utils.encode_cell({ r: i + 1, c: col });
      if (ws[cellRef]) { ws[cellRef].t = "s"; ws[cellRef].v = String(r[col] ?? ""); ws[cellRef].z = "@"; }
    });
  });

  // Độ rộng cột theo nội dung dài nhất (ký tự), có min/max hợp lý.
  ws["!cols"] = headers.map((h, c) => {
    let max = h.length;
    rows.forEach(r => { max = Math.max(max, String(r[c] ?? "").length); });
    return { wch: Math.min(Math.max(max + 2, 10), 45) };
  });

  ws["!autofilter"] = { ref: ws["!ref"] };
  ws["!freeze"] = { xSplit: 0, ySplit: 1 };
  ws["!rows"] = [{ hpx: 22 }];

  headers.forEach((_, c) => {
    const cellRef = XLSX.utils.encode_cell({ r: 0, c });
    if (ws[cellRef]) ws[cellRef].s = { font: { bold: true } };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Đơn hàng");

  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `don-hang-lumishow-${stamp}.xlsx`, { cellStyles: true });
});
</script>
