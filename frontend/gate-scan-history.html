<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiShow — Lịch sử quét vé (nội bộ)</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#0b0f0d; --panel:#121815; --border:rgba(255,255,255,.1);
    --text:#e6f1ea; --dim:#8fa196; --green:#3ddc84; --red:#ff6b6b; --gold:#fbbb21;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  [hidden]{display:none!important;}

  /* ---- Gate khoá app soát vé (giống gate-scanner.html, cùng key) ---- */
  #gate{max-width:380px;margin:12vh auto;padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  #gate h2{font-size:17px;margin:0 0 6px;}
  #gate p{color:var(--dim);font-size:12.5px;margin:0 0 18px;}
  #gate input{width:100%;padding:12px 13px;border-radius:8px;border:1px solid var(--border);background:#0d1310;color:var(--text);font-size:15px;margin-bottom:10px;}
  #gate button{width:100%;padding:12px;border-radius:8px;border:none;background:var(--green);color:#04140b;font-weight:700;font-size:15px;cursor:pointer;}
  #gate button:hover{opacity:.9;}
  #gate button:disabled{opacity:.5;cursor:default;}
  #gateError{color:var(--red);font-size:12.5px;min-height:16px;margin-top:4px;}

  #app{padding:28px 20px 60px;}
  .wrap{max-width:700px;margin:0 auto;}

  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .head-row h1{font-size:19px;font-weight:800;margin:0 0 4px;}
  .head-row .sub{color:var(--dim);font-size:12.5px;margin:0;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}
  .btn:hover{border-color:var(--green);color:var(--green);}

  #list{display:flex;flex-direction:column;gap:10px;}
  .h-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;border-left:4px solid var(--border);}
  .h-card.ok{border-left-color:var(--green);}
  .h-card.partial{border-left-color:var(--gold);}
  .h-card.fail{border-left-color:var(--red);}
  .h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .h-title{font-size:14.5px;font-weight:800;}
  .h-card.ok .h-title{color:var(--green);}
  .h-card.partial .h-title{color:var(--gold);}
  .h-card.fail .h-title{color:var(--red);}
  .h-time{color:var(--dim);font-size:11px;white-space:nowrap;padding-top:2px;}
  .h-name{font-size:13px;font-weight:600;margin:3px 0 0;}
  .h-sub{color:var(--dim);font-size:11.5px;margin:2px 0 0;}
  .h-code{color:var(--dim);font-size:9.5px;margin-top:4px;word-break:break-all;opacity:.7;}

  .empty{color:var(--dim);font-size:13px;text-align:center;padding:40px 0;}
  .loading{color:var(--dim);font-size:13px;text-align:center;padding:40px 0;}
</style>
</head>
<body>

<div id="gate">
  <h2>Khoá app soát vé</h2>
  <p>Nhập khoá riêng của app soát vé (GATE_API_KEY) để xem lịch sử quét vé.</p>
  <input type="password" id="gateInput" placeholder="Khoá app soát vé" autocomplete="off">
  <button id="gateBtn">Xem lịch sử</button>
  <div id="gateError"></div>
</div>

<div id="app" hidden>
  <div class="wrap">

    <div class="head-row">
      <div>
        <h1>📜 Lịch sử quét vé</h1>
        <p class="sub">Tối đa 100 lượt quét gần nhất tại cổng (kể cả lượt TestScan, đánh dấu riêng).</p>
      </div>
      <div class="head-actions">
        <button class="btn" id="refreshBtn">↻ Tải lại</button>
        <a class="btn" href="gate-scanner.html">← Quay lại quét vé</a>
      </div>
    </div>

    <div id="list"><p class="loading">Đang tải...</p></div>

  </div>
</div>

<script>
const API = "https://lumishow-website.onrender.com/api";
const KEY_STORAGE = "lumishow-gate-key";

let GATE_KEY = "";

function $(id){ return document.getElementById(id); }

async function loadHistory(){
  $("list").innerHTML = '<p class="loading">Đang tải...</p>';
  try {
    const res = await fetch(API + "/admin/tickets/scan-history", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gateKey: GATE_KEY })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {}
      location.reload();
      return;
    }
    if (!res.ok || !data.success) throw new Error(data.message || "Lỗi không xác định");
    renderHistory(data.history || []);
  } catch (err) {
    $("list").innerHTML = `<p class="empty">${escapeHtml(err.message)}</p>`;
  }
}

function fmtDateTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("vi-VN") + " " + d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function renderHistory(items){
  if (!items.length) {
    $("list").innerHTML = '<p class="empty">Chưa có lượt quét nào</p>';
    return;
  }

  $("list").innerHTML = items.map((r) => {
    const partial = r.checkedInCount > 0 && r.checkedInCount < r.totalCount;
    const ok = r.checkedInCount > 0;
    const cls = partial ? "partial" : (ok ? "ok" : "fail");
    const icon = partial ? "⚠" : (ok ? "✓" : "✗");
    const countSuffix = r.totalCount > 1 ? ` (${r.checkedInCount}/${r.totalCount} vé)` : "";
    const title = !ok
      ? `${icon} KHÔNG CHECK-IN ĐƯỢC`
      : (partial ? `${icon} CHECK-IN MỘT PHẦN${countSuffix}` : `${icon} ĐÃ CHECK-IN${countSuffix}`);
    const testBadge = r.testMode ? ' <span style="color:var(--gold);font-weight:800;">[TEST]</span>' : "";

    const seatLine = (r.seats || []).length ? "Ghế " + r.seats.join(", ") : "";
    const nameSeatLine = [r.customerName, seatLine].filter(Boolean).join(" · ");
    const subLine = [r.showtimeId, (!ok || partial) ? r.message : ""].filter(Boolean).join(" · ");

    return `
      <div class="h-card ${cls}">
        <div class="h-top">
          <span class="h-title">${title}${testBadge}</span>
          <span class="h-time">${fmtDateTime(r.scannedAt)}</span>
        </div>
        ${nameSeatLine ? `<p class="h-name">${escapeHtml(nameSeatLine)}</p>` : ""}
        ${subLine ? `<p class="h-sub">${escapeHtml(subLine)}</p>` : ""}
        <p class="h-code">${escapeHtml(r.ticketCode || "")}</p>
      </div>
    `;
  }).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("refreshBtn").addEventListener("click", loadHistory);

async function verifyGateKey(key){
  const res = await fetch(API + "/admin/tickets/scan-history", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ gateKey: key })
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) throw new Error(data.message || "Sai khoá app soát vé");
  if (!res.ok) throw new Error(data.message || "Lỗi không xác định");
  return data.history || [];
}

$("gateBtn").addEventListener("click", async () => {
  const key = $("gateInput").value.trim();
  $("gateError").textContent = "";
  if (!key) { $("gateError").textContent = "Nhập khoá app soát vé"; return; }
  $("gateBtn").disabled = true;
  try {
    const history = await verifyGateKey(key);
    GATE_KEY = key;
    try { sessionStorage.setItem(KEY_STORAGE, key); } catch (e) {}
    $("gate").hidden = true;
    $("app").hidden = false;
    renderHistory(history);
  } catch (err) {
    $("gateError").textContent = err.message;
  } finally {
    $("gateBtn").disabled = false;
  }
});
$("gateInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("gateBtn").click(); });

(function tryResumeGateKey(){
  let saved = "";
  try { saved = sessionStorage.getItem(KEY_STORAGE) || ""; } catch (e) {}
  if (!saved) return;
  GATE_KEY = saved;
  $("gate").hidden = true;
  $("app").hidden = false;
  loadHistory();
})();
</script>
</body>
</html>
