<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiShow — Tạo đơn vé thủ công</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#08100c; --panel:#111a14; --panel2:#0d1310; --border:rgba(255,255,255,.1);
    --text:#e8eee9; --dim:#8fa196; --green:#3ddc84; --red:#ef6b68; --gold:#fbbb21; --blue:#4fb0ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  [hidden]{display:none!important;}

  #gate{max-width:380px;margin:12vh auto;padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  #gate h2{font-size:17px;margin:0 0 6px;}
  #gate p{color:var(--dim);font-size:12.5px;margin:0 0 18px;}
  #gate input{width:100%;padding:12px 13px;border-radius:8px;border:1px solid var(--border);background:#0d1310;color:var(--text);font-size:15px;margin-bottom:10px;box-sizing:border-box;}
  #gate button{width:100%;padding:12px;border-radius:8px;border:none;background:var(--green);color:#04140b;font-weight:700;font-size:15px;}
  #gate button:hover{opacity:.9;}
  #gateError{color:var(--red);font-size:12.5px;min-height:16px;margin-top:4px;}

  #app{display:flex;flex-direction:column;height:100vh;}
  .top{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;background:var(--panel);}
  .top h1{font-size:16px;margin:0;flex-basis:100%;color:var(--gold);}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--dim);}
  .field input{padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;min-width:150px;}
  .spacer{flex:1;}

  /* ---- Combobox chọn suất diễn — COPY nguyên cơ chế từ partner-orders.html
     ("Danh sách đơn"), chỉ đổi: chọn 1 pill là tải sơ đồ ngay (không có hàng
     "Mọi suất diễn" vì trang này bắt buộc phải chọn đúng 1 suất). ---- */
  .st-picker{position:relative;min-width:230px;}
  .st-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);font-size:13px;cursor:pointer;text-align:left;
  }
  .st-btn:hover{border-color:rgba(255,255,255,.22);}
  .st-btn .chev{width:14px;height:14px;flex-shrink:0;color:var(--dim);transition:transform .15s;}
  .st-picker.open .st-btn .chev{transform:rotate(180deg);}
  .st-btn .st-btn-label.placeholder{color:var(--dim);}
  .st-panel{
    position:absolute;top:calc(100% + 6px);left:0;width:min(420px,90vw);max-height:min(480px,70vh);
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;z-index:20;
  }
  .st-search-row{padding:10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
  .st-search{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:#0d1310;color:var(--text);font-size:13px;}
  .st-search:focus{outline:none;border-color:var(--green);}
  .st-list{overflow-y:auto;padding:6px 0;}
  .st-month{padding:12px 14px 6px;font-size:12px;font-weight:700;color:var(--dim);border-top:1px solid var(--border);margin-top:4px;}
  .st-month:first-of-type{border-top:none;margin-top:0;}
  .st-date-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 14px;}
  .st-date-label{font-size:12.5px;color:var(--text);white-space:nowrap;}
  .st-date-label .dow{color:var(--dim);margin-right:5px;}
  .st-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .st-pill{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
  .st-pill.st-open{background:rgba(61,220,132,.14);color:var(--green);}
  .st-pill.st-open:hover{background:rgba(61,220,132,.26);}
  .st-pill.st-closed{background:transparent;color:var(--dim);border-color:var(--border);opacity:.6;}
  .st-pill.st-closed:hover{opacity:1;}
  .st-pill.active{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset;}
  .st-no-match{padding:24px 14px;text-align:center;color:var(--dim);font-size:13px;}
  .total-box{text-align:right;}
  .total-box .tl{font-size:11px;color:var(--dim);}
  .total-box .tv{font-size:18px;font-weight:800;color:var(--gold);}
  #createBtn{padding:10px 18px;border-radius:8px;border:none;background:var(--green);color:#04140b;font-weight:700;font-size:13.5px;}
  #createBtn:disabled{opacity:.4;cursor:default;}
  .counts{font-size:11.5px;color:var(--dim);flex-basis:100%;}
  .counts b{color:var(--text);}

  .canvas-wrap{flex:1;position:relative;overflow:hidden;background:#050a07;}
  #seatSvg{width:100%;height:100%;display:block;}
  .seat{cursor:pointer;stroke:#000;stroke-width:1;}
  .seat.st-blocked{fill:#5a5f66;opacity:.6;cursor:not-allowed;}
  .seat.st-sold{fill:#2b2f33;stroke:#111;cursor:not-allowed;}
  .seat.st-held{fill:#f59e0b;cursor:not-allowed;}
  .seat.st-sel{stroke:#00e5ff;stroke-width:3;}
  .select-box{fill:rgba(79,176,255,.15);stroke:#4fb0ff;stroke-width:1.5;stroke-dasharray:4,3;}
  .row-label{font-size:13px;fill:#7d9186;text-anchor:end;}
  .zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:16px;}
  .hint{position:absolute;left:16px;bottom:16px;color:var(--dim);font-size:11px;max-width:320px;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:7px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2620;border:1px solid var(--border);
    color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:520px;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="gate">
  <h2>Nhập PIN admin</h2>
  <p>Nhập PIN admin để tạo đơn vé thủ công.</p>
  <input type="password" id="gateInput" placeholder="PIN admin" autocomplete="off">
  <button id="gateBtn">Vào trang</button>
  <div id="gateError"></div>
</div>

<div id="app" hidden>
  <div class="top">
    <h1>🎟️ Tạo đơn vé thủ công — nhiều ghế gộp 1 đơn</h1>
    <div class="field">
      <label for="stBtn">Suất diễn</label>
      <div class="st-picker" id="stPicker">
        <button type="button" class="st-btn" id="stBtn">
          <span class="st-btn-label placeholder" id="stBtnLabel">Chọn suất diễn...</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="st-panel" id="stPanel" hidden>
          <div class="st-search-row">
            <input type="text" class="st-search" id="stSearch" placeholder="Tìm theo ngày, thứ hoặc giờ...">
          </div>
          <div class="st-list" id="stList"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="fName">Tên khách *</label>
      <input type="text" id="fName" placeholder="Nguyễn Văn A">
    </div>
    <div class="field">
      <label for="fPhone">SĐT</label>
      <input type="text" id="fPhone">
    </div>
    <div class="field">
      <label for="fEmail">Email nhận vé</label>
      <input type="text" id="fEmail" placeholder="Để trống = không gửi mail vé cho khách">
    </div>
    <div class="spacer"></div>
    <div class="total-box">
      <div class="tl"><span id="selCount">0</span> ghế đã chọn</div>
      <div class="tv" id="selTotal">0đ</div>
    </div>
    <button id="createBtn" disabled>Tạo đơn</button>
    <div class="counts" id="seCounts"></div>
  </div>

  <div class="canvas-wrap">
    <svg id="seatSvg" viewBox="0 0 1360 1360" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="hint">Click: chọn/bỏ ghế · Kéo trên nền: chọn nhiều · Giữ Ctrl + kéo: quét chọn nhanh · Cuộn: zoom · Giữ phím cách + kéo: di chuyển</div>
    <div class="zoom">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="zoomReset">⤢</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://lumishow-website.onrender.com/api";
const SHOW_ID = "son-than-thuy-quai";
const KEY_STORAGE = "lumishow-admin-pin"; // dùng chung mọi trang admin khác

function $(id){ return document.getElementById(id); }

function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 3600);
}

let pin = "";
async function callAdmin(path, body){
  const res = await fetch(`${API}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...(body || {}), password: pin })
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) throw new Error(data.message || "Sai PIN admin");
  if (!res.ok || !data.success) throw new Error(data.message || "Thao tác thất bại");
  return data;
}

async function verifyPin(p){
  const res = await fetch(`${API}/admin/verify-pin`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: p })
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) throw new Error(data.message || "Sai PIN admin");
  if (!res.ok) throw new Error(data.message || "Lỗi không xác định");
}

function showApp(){ $("gate").hidden = true; $("app").hidden = false; loadShowtimesList(); }

$("gateBtn").addEventListener("click", async () => {
  const p = $("gateInput").value.trim();
  $("gateError").textContent = "";
  if (!p) { $("gateError").textContent = "Nhập PIN admin"; return; }
  $("gateBtn").disabled = true;
  try {
    await verifyPin(p);
    pin = p;
    try { sessionStorage.setItem(KEY_STORAGE, p); } catch (e) {}
    showApp();
  } catch (err) {
    $("gateError").textContent = err.message;
  } finally {
    $("gateBtn").disabled = false;
  }
});
$("gateInput").addEventListener("keydown", e => { if (e.key === "Enter") $("gateBtn").click(); });

(function tryResume(){
  let saved = "";
  try { saved = sessionStorage.getItem(KEY_STORAGE) || ""; } catch (e) {}
  if (!saved) return;
  pin = saved;
  verifyPin(saved).then(showApp).catch(() => { try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {} pin = ""; });
})();

// ==========================================
// SƠ ĐỒ GHẾ — toạ độ/hạng COPY NGUYÊN VĂN từ admin-showtimes.html (cùng
// nguồn gốc dat-ve.html/SEAT_XY/VIP_SEAT_XY/tierOf) — đồng bộ tay nếu toạ độ
// gốc đổi. Giá tiền thêm vào TIERS CHỈ để xem tổng tạm trước khi tạo đơn —
// số tiền THẬT luôn do backend tự cộng lại từ Firestore lúc tạo đơn (xem
// createManualOrder() trong admin.service.js), không tin số ở đây.
// ==========================================

const CX = 680, CY = 680;
const TIERS = {
  'vua-hung':  { color:'#FF8A3D', price:400000 },
  'son-than':  { color:'#7CFF5A', price:300000 },
  'thuy-quai': { color:'#23B6FF', price:250000 },
  'mi-nuong':  { color:'#FFD15A', price:200000 }
};
const INNER_ROWS = new Set(['B','C','D','E','G','H','I']);
const OUTER_ROWS = new Set(['K','L','M','N']);
const EXIT_SIDE_UPGRADE = {
  B:{odd:[35,51], even:[36,52]},   C:{odd:[41,61], even:[42,62]},
  D:{odd:[47,69], even:[48,70]},   E:{odd:[51,75], even:[42,80]},
  G:{odd:[53,87], even:[42,88]},   H:{odd:[47,93], even:[60,94]},
  I:{odd:[41,65], even:[46,66]},   K:{odd:[51,93], even:[74,94]},
  L:{odd:[73,101],even:[82,104]},  M:{odd:[83,103],even:[86,106]}
};
function tierOf(rowCode, y, num){
  const front = y > CY;
  if (rowCode === 'VIP') return 'vua-hung';
  if (front && INNER_ROWS.has(rowCode)) return 'son-than';
  if (front && OUTER_ROWS.has(rowCode)) return 'thuy-quai';
  const exit = EXIT_SIDE_UPGRADE[rowCode];
  if (exit){
    const range = (num % 2 === 1) ? exit.odd : exit.even;
    if (num >= range[0] && num <= range[1]) return 'thuy-quai';
  }
  return 'mi-nuong';
}

function buildSeats(){
  const coords = { ...SEAT_XY, ...VIP_SEAT_XY };
  return Object.keys(coords).map(id => {
    const m = id.match(/^([A-Z]+)(\d+)$/);
    const rowCode = m[1], num = parseInt(m[2], 10);
    const [x, y] = coords[id];
    return { id, row: rowCode, num, tier: tierOf(rowCode, y, num), x, y };
  });
}
const SEATS = buildSeats();

function buildRowLabels(seats){
  const byRow = new Map();
  seats.forEach(s => {
    if (s.row === 'VIP') return;
    const cur = byRow.get(s.row);
    if (!cur || s.x < cur.x) byRow.set(s.row, s);
  });
  return [...byRow.entries()].map(([row, s]) => ({ row, x: s.x - 20, y: s.y + 4 }));
}
const ROW_LABELS = buildRowLabels(SEATS);

function mk(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

let currentShowtimeId = null;
let seatStatuses = {};
let selectedIds = new Set();
const svg = $("seatSvg");

function updateCounts(){
  const counts = { AVAILABLE: 0, BLOCKED: 0, SOLD: 0, HELD: 0 };
  Object.values(seatStatuses).forEach(s => { if (counts[s] !== undefined) counts[s]++; });
  $("seCounts").innerHTML =
    `<span>Tổng: <b>${SEATS.length}</b></span> · ` +
    `<span>Trống: <b>${counts.AVAILABLE}</b></span> · ` +
    `<span>Khoá: <b>${counts.BLOCKED}</b></span> · ` +
    `<span>Đã bán: <b>${counts.SOLD}</b></span> · ` +
    `<span>Đang giữ: <b>${counts.HELD}</b></span>`;
}

function seatFill(seat){
  const status = seatStatuses[seat.id];
  if (status === "BLOCKED") return "#5a5f66";
  if (status === "SOLD") return "#2b2f33";
  if (status === "HELD") return "#f59e0b";
  return TIERS[seat.tier].color;
}
function seatClass(seat){
  const status = seatStatuses[seat.id];
  let cls = "seat";
  if (status === "BLOCKED") cls += " st-blocked";
  if (status === "SOLD") cls += " st-sold";
  if (status === "HELD") cls += " st-held";
  if (selectedIds.has(seat.id)) cls += " st-sel";
  return cls;
}
function canSelect(id){
  const s = seatStatuses[id];
  return s === "AVAILABLE";
}

function renderSeatSvg(){
  svg.innerHTML = "";
  const gLabels = mk("g", {});
  ROW_LABELS.forEach(l => {
    const t = mk("text", { x: l.x, y: l.y, class: "row-label" });
    t.textContent = l.row;
    gLabels.appendChild(t);
  });
  svg.appendChild(gLabels);

  const gSeats = mk("g", {});
  SEATS.forEach(s => {
    const isVip = s.row === "VIP";
    const w = isVip ? 14 : 15, h = isVip ? 20 : 15;
    const rect = mk("rect", {
      x: (s.x - w / 2).toFixed(1), y: (s.y - h / 2).toFixed(1),
      width: w, height: h, rx: isVip ? 2 : w / 2,
      fill: seatFill(s), class: seatClass(s)
    });
    rect.dataset.id = s.id;
    const title = mk("title", {});
    title.textContent = `${s.id} — ${seatStatuses[s.id] || "?"} — ${TIERS[s.tier].price.toLocaleString("vi-VN")}đ`;
    rect.appendChild(title);
    gSeats.appendChild(rect);
  });
  svg.appendChild(gSeats);

  svg.appendChild(mk("g", { id: "gOverlay" }));
}

function repaintSeat(id){
  const rect = svg.querySelector(`rect[data-id="${CSS.escape(id)}"]`);
  if (!rect) return;
  const seat = SEATS.find(s => s.id === id);
  rect.setAttribute("fill", seatFill(seat));
  rect.setAttribute("class", seatClass(seat));
}

function updateSelectionUI(){
  const ids = [...selectedIds];
  const total = ids.reduce((sum, id) => {
    const seat = SEATS.find(s => s.id === id);
    return sum + (seat ? TIERS[seat.tier].price : 0);
  }, 0);
  $("selCount").textContent = ids.length;
  $("selTotal").textContent = total.toLocaleString("vi-VN") + "đ";
  $("createBtn").disabled = ids.length === 0 || !currentShowtimeId;
}

// ---- Combobox chọn suất diễn — COPY cơ chế từ partner-orders.html
// ("Danh sách đơn"), tái dùng thẳng /partner/showtimes/list (đã chấp nhận
// PIN admin qua checkPartnerKey() từ lần sửa trước, không cần route riêng).
// Khác trang đó: chọn 1 pill là TẢI SƠ ĐỒ NGAY (không có hàng "Mọi suất
// diễn" vì trang này bắt buộc đúng 1 suất).
const DOW_SHORT = ["CN","T2","T3","T4","T5","T6","T7"];
let allShowtimes = [];

const stPicker = $("stPicker"), stBtn = $("stBtn"), stBtnLabel = $("stBtnLabel");
const stPanel = $("stPanel"), stSearch = $("stSearch"), stList = $("stList");

async function loadShowtimesList(){
  try {
    const res = await fetch(`${API}/partner/showtimes/list`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apiKey: pin })
    });
    const data = await res.json();
    if (!res.ok || !data.success) return;
    allShowtimes = data.showtimes;
    renderShowtimePicker(allShowtimes);
  } catch (e) {}
}

function renderShowtimePicker(showtimes){
  const byMonth = new Map();
  showtimes.forEach(st => {
    const [datePart] = st.showtimeId.split("_");
    const [y, m] = datePart.split("-").map(Number);
    const monthKey = `${y}-${String(m).padStart(2,"0")}`;
    if (!byMonth.has(monthKey)) byMonth.set(monthKey, new Map());
    const byDate = byMonth.get(monthKey);
    if (!byDate.has(datePart)) byDate.set(datePart, []);
    byDate.get(datePart).push(st);
  });

  const monthKeys = [...byMonth.keys()].sort().reverse();
  let html = "";
  if (monthKeys.length === 0) html = `<div class="st-no-match">Không có suất diễn nào khớp tìm kiếm.</div>`;

  monthKeys.forEach(monthKey => {
    const [y, m] = monthKey.split("-").map(Number);
    html += `<div class="st-month">Tháng ${m}, ${y}</div>`;
    const byDate = byMonth.get(monthKey);
    const dateKeys = [...byDate.keys()].sort().reverse();
    dateKeys.forEach(datePart => {
      const [dy, dm, dd] = datePart.split("-").map(Number);
      const dow = DOW_SHORT[new Date(dy, dm - 1, dd).getDay()];
      const pills = byDate.get(datePart)
        .sort((a, b) => a.showtimeId.localeCompare(b.showtimeId))
        .map(st => {
          const time = st.showtimeId.split("_")[1];
          const cls = st.status === "OPEN" ? "st-open" : "st-closed";
          const active = st.showtimeId === currentShowtimeId ? " active" : "";
          return `<button type="button" class="st-pill ${cls}${active}" data-showtime="${st.showtimeId}">${time}</button>`;
        }).join("");
      html += `<div class="st-date-row">
        <span class="st-date-label"><span class="dow">${dow}</span>${String(dd).padStart(2,"0")}/${String(dm).padStart(2,"0")}</span>
        <span class="st-pills">${pills}</span>
      </div>`;
    });
  });
  stList.innerHTML = html;
}

function fmtShowtimeLabel(showtimeId){
  const [datePart, timePart] = showtimeId.split("_");
  const [y, m, d] = datePart.split("-").map(Number);
  return `${DOW_SHORT[new Date(y, m - 1, d).getDay()]}, ${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y} · ${timePart}`;
}

function openStPanel(){ stPanel.hidden = false; stPicker.classList.add("open"); stSearch.value = ""; renderShowtimePicker(allShowtimes); stSearch.focus(); }
function closeStPanel(){ stPanel.hidden = true; stPicker.classList.remove("open"); }

stBtn.addEventListener("click", () => { stPanel.hidden ? openStPanel() : closeStPanel(); });
document.addEventListener("click", (e) => { if (!stPicker.contains(e.target)) closeStPanel(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeStPanel(); });

stSearch.addEventListener("input", () => {
  const q = stSearch.value.trim().toLowerCase();
  if (!q) { renderShowtimePicker(allShowtimes); return; }
  renderShowtimePicker(allShowtimes.filter(st => fmtShowtimeLabel(st.showtimeId).toLowerCase().includes(q) || st.showtimeId.toLowerCase().includes(q)));
});

stList.addEventListener("click", (e) => {
  const pill = e.target.closest(".st-pill");
  if (!pill) return;
  closeStPanel();
  loadShowtime(pill.dataset.showtime);
});

// ---- Tải sơ đồ ghế của 1 suất diễn ----
async function loadShowtime(showtimeId){
  currentShowtimeId = showtimeId;
  stBtnLabel.textContent = fmtShowtimeLabel(showtimeId);
  stBtnLabel.classList.remove("placeholder");
  selectedIds.clear();
  try {
    const res = await fetch(`${API}/shows/${SHOW_ID}/showtimes/${showtimeId}/seats`);
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || "Không tải được trạng thái ghế");
    seatStatuses = {};
    Object.keys(data.seats).forEach(id => { seatStatuses[id] = data.seats[id].status; });
    renderSeatSvg();
    updateCounts();
    updateSelectionUI();
    toast(`Đã tải sơ đồ suất ${showtimeId}`);
  } catch (e) {
    toast("Lỗi tải sơ đồ: " + e.message);
  }
}

// ---- Click chọn/bỏ chọn ghế ----
svg.addEventListener("click", (e) => {
  const rectEl = e.target.closest(".seat");
  if (!rectEl) return;
  const id = rectEl.dataset.id;
  if (!canSelect(id) && !selectedIds.has(id)) {
    toast(`Ghế ${id} không còn trống (đang ${seatStatuses[id]})`);
    return;
  }
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  repaintSeat(id);
  updateSelectionUI();
});

// ---- Kéo chọn nhiều + Ctrl quét chọn + pan (y hệt admin-showtimes.html) ----
let dragStart = null, dragBox = null, didDrag = false, isPanning = false, panLast = null, spacePressed = false, isPaintSelecting = false;

document.addEventListener("keydown", (e) => { if (e.code === "Space" && !$("app").hidden) { spacePressed = true; e.preventDefault(); } });
document.addEventListener("keyup", (e) => { if (e.code === "Space") spacePressed = false; });

function clientToSvg(clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function paintSelectAt(target){
  const rectEl = target.closest(".seat");
  if (!rectEl) return;
  const id = rectEl.dataset.id;
  if (!canSelect(id) || selectedIds.has(id)) return;
  selectedIds.add(id);
  repaintSeat(id);
  updateSelectionUI();
}

svg.addEventListener("mousedown", (e) => {
  if (e.ctrlKey && !spacePressed && e.button !== 1) { isPaintSelecting = true; return; }
  if (e.target.closest(".seat")) return;
  if (spacePressed || e.button === 1) {
    isPanning = true;
    panLast = { x: e.clientX, y: e.clientY };
    e.preventDefault();
    return;
  }
  const pt = clientToSvg(e.clientX, e.clientY);
  dragStart = pt;
  didDrag = false;
  dragBox = mk("rect", { x: pt.x, y: pt.y, width: 0, height: 0, class: "select-box" });
  document.getElementById("gOverlay").appendChild(dragBox);
});

window.addEventListener("mousemove", (e) => {
  if (isPaintSelecting) { paintSelectAt(e.target); return; }
  if (isPanning && panLast) {
    const scale = vb.w / svg.clientWidth;
    vb.x -= (e.clientX - panLast.x) * scale;
    vb.y -= (e.clientY - panLast.y) * scale;
    panLast = { x: e.clientX, y: e.clientY };
    applyViewBox();
    return;
  }
  if (!dragStart) return;
  const pt = clientToSvg(e.clientX, e.clientY);
  if (Math.abs(pt.x - dragStart.x) > 3 || Math.abs(pt.y - dragStart.y) > 3) didDrag = true;
  const x = Math.min(pt.x, dragStart.x), y = Math.min(pt.y, dragStart.y);
  const w = Math.abs(pt.x - dragStart.x), h = Math.abs(pt.y - dragStart.y);
  dragBox.setAttribute("x", x); dragBox.setAttribute("y", y);
  dragBox.setAttribute("width", w); dragBox.setAttribute("height", h);
});

window.addEventListener("mouseup", () => {
  if (isPaintSelecting) { isPaintSelecting = false; return; }
  if (isPanning) { isPanning = false; panLast = null; return; }
  if (!dragStart) return;

  if (didDrag) {
    const x = parseFloat(dragBox.getAttribute("x")), y = parseFloat(dragBox.getAttribute("y"));
    const w = parseFloat(dragBox.getAttribute("width")), h = parseFloat(dragBox.getAttribute("height"));
    SEATS.forEach(s => {
      if (s.x >= x && s.x <= x + w && s.y >= y && s.y <= y + h && canSelect(s.id)) {
        selectedIds.add(s.id);
        repaintSeat(s.id);
      }
    });
    updateSelectionUI();
  }
  if (dragBox) dragBox.remove();
  dragBox = null;
  dragStart = null;
});

// ---- Zoom (wheel + nút) ----
let vb = { x: 0, y: 0, w: 1360, h: 1360 };
function applyViewBox(){ svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function zoomAt(clientX, clientY, factor){
  const pt = clientToSvg(clientX, clientY);
  const newW = Math.min(1360, Math.max(120, vb.w * factor));
  const newH = newW;
  vb.x = pt.x - (pt.x - vb.x) * (newW / vb.w);
  vb.y = pt.y - (pt.y - vb.y) * (newH / vb.h);
  vb.w = newW; vb.h = newH;
  applyViewBox();
}
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.12 : 0.89);
}, { passive: false });
$("zoomIn").addEventListener("click", () => {
  const r = svg.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.8);
});
$("zoomOut").addEventListener("click", () => {
  const r = svg.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25);
});
$("zoomReset").addEventListener("click", () => { vb = { x: 0, y: 0, w: 1360, h: 1360 }; applyViewBox(); });
applyViewBox();

// ---- Tạo đơn ----
$("createBtn").addEventListener("click", async () => {
  const seatIds = [...selectedIds];
  const customerName = $("fName").value.trim();
  if (!customerName) { toast("Cần nhập tên khách"); return; }
  if (seatIds.length === 0) { toast("Chưa chọn ghế nào"); return; }

  const customerPhone = $("fPhone").value.trim();
  const customerEmail = $("fEmail").value.trim();

  if (!confirm(`Tạo đơn ${seatIds.length} ghế (${seatIds.join(", ")}) cho "${customerName}"?\nKhông thể hoàn tác.`)) return;

  $("createBtn").disabled = true;
  try {
    const d = await callAdmin("/admin/orders/create", { showtimeId: currentShowtimeId, seatIds, customerName, customerPhone, customerEmail });
    toast(`${d.message}. ${d.ticketEmailSent ? "Đã gửi vé cho khách." : customerEmail ? "Gửi vé cho khách thất bại." : "Không có email, chưa gửi vé."} ${d.notifySent ? "Đã báo nội bộ." : "Báo nội bộ thất bại."}`);
    seatIds.forEach(id => { seatStatuses[id] = "SOLD"; });
    selectedIds.clear();
    renderSeatSvg();
    updateCounts();
    updateSelectionUI();
    $("fName").value = ""; $("fPhone").value = ""; $("fEmail").value = "";
  } catch (err) {
    alert(err.message);
  } finally {
    updateSelectionUI();
  }
});
</script>
