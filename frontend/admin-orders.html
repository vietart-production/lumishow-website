<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý đơn vé | LumiShow</title>
<style>
:root{--bg:#08100c;--panel:#111a14;--line:#2b4132;--text:#e8eee9;--muted:#a5b1a7;--gold:#fbbb21;--bad:#ef6b68;--ok:#7bde84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:980px;margin:40px auto;padding:0 18px}h1{font-size:25px;margin:0 0 6px;color:var(--gold)}p{color:var(--muted)}.bar,.card{background:var(--panel);border:1px solid var(--line);padding:16px;margin:16px 0}.bar{display:flex;gap:8px}.bar input{flex:1}input,select,button{padding:10px;border:1px solid var(--line);border-radius:4px;background:#0a120d;color:var(--text)}button{background:var(--gold);color:#1e1703;border:0;font-weight:bold;cursor:pointer}.danger{background:var(--bad)}.secondary{background:#304436;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wide{grid-column:1/-1}label{display:grid;gap:5px;color:var(--muted)}#result{white-space:pre-wrap;line-height:1.6}.notice{min-height:20px;color:var(--ok)}.error{color:var(--bad)}[hidden]{display:none}.seatlist{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 0}.seatlist label{display:inline-flex;flex-direction:row;align-items:center;gap:5px;color:var(--text)}.seatlist input{width:auto;padding:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.bar{flex-wrap:wrap}.bar input{min-width:100%}}
</style><body><main class="wrap"><h1>Quản lý đơn vé</h1><p>Tra cứu bằng mã đơn trước khi thao tác. Các thay đổi không thể hoàn tác.</p><div class="bar"><input id="code" inputmode="numeric" placeholder="Mã đơn"><button id="lookup">Tra cứu</button></div><div id="notice" class="notice"></div><section id="tool" class="card" hidden><div id="result"></div><hr><div class="grid"><label>Họ tên<input id="name"></label><label>Số điện thoại<input id="phone"></label><label>Email nhận vé<input id="email" type="email"></label><button id="save" class="secondary">Lưu thông tin khách</button><button id="resend" class="secondary">Gửi lại email vé</button><button id="delete" class="danger">Hủy/xóa đơn và trả ghế</button><label class="wide">Huỷ một phần ghế (giữ lại ghế còn lại, tự tính lại tiền)<div id="cancelSeats" class="seatlist"></div></label><button id="cancelSeatsBtn" class="danger wide">Huỷ các ghế đã chọn</button><label class="wide">Suất mới<input id="showtime" placeholder="YYYY-MM-DD_HH:MM"></label><label class="wide">Ghế mới, cách nhau bằng dấu phẩy<input id="seats" placeholder="H70, H72, H74"></label><button id="exchange" class="wide">Đổi suất/ghế và gửi vé mới</button></div></section></main><script>
const API='https://lumishow-website.onrender.com/api';let pin=sessionStorage.getItem('lumishow-admin-pin')||prompt('Nhập PIN admin'),order;
const $=id=>document.getElementById(id),say=(text,bad=false)=>{$('notice').textContent=text;$('notice').className=bad?'error':'notice'};
async function call(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,password:pin})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Thao tác thất bại');return d}
function render(){const o=order,valid=o.tickets.filter(t=>t.ticketStatus==='valid');$('result').textContent=`#${o.orderCode}\n${o.customerName} | ${o.customerPhone} | ${o.customerEmail}\n${o.showtimeId} — ${(o.seatIds||[]).join(', ')}\n${valid.length} vé hợp lệ`;['name','phone','email'].forEach((k,i)=>$(k).value=[o.customerName,o.customerPhone,o.customerEmail][i]||'');$('showtime').value=o.showtimeId;$('seats').value=(o.seatIds||[]).join(', ');$('cancelSeats').innerHTML=valid.map(t=>`<label><input type="checkbox" value="${t.seatId}">${t.seatId} (${(t.price||0).toLocaleString('vi-VN')}đ)</label>`).join('');$('tool').hidden=false}
async function lookup(){try{order=(await call('/admin/orders/lookup',{orderCode:$('code').value})).order;render();say('Đã tìm thấy đơn. Kiểm tra kỹ trước khi thao tác.')}catch(e){say(e.message,true)}}$('lookup').onclick=lookup;$('code').onkeydown=e=>e.key==='Enter'&&lookup();
$('save').onclick=async()=>{try{await call('/admin/orders/update',{orderId:order.orderId,customerName:$('name').value,customerPhone:$('phone').value,customerEmail:$('email').value});await lookup();say('Đã cập nhật thông tin khách.')}catch(e){say(e.message,true)}};
$('resend').onclick=async()=>{try{const d=await call('/admin/orders/resend-ticket-email',{orderId:order.orderId});say(`Đã gửi ${d.ticketCount} vé tới ${d.email}.`)}catch(e){say(e.message,true)}};
$('exchange').onclick=async()=>{if(!confirm('Đổi vé sẽ hủy QR cũ và gửi QR mới. Tiếp tục?'))return;try{await call('/admin/orders/exchange-tickets',{orderId:order.orderId,toShowtimeId:$('showtime').value.trim(),toSeatIds:$('seats').value.split(',').map(x=>x.trim()).filter(Boolean)});await lookup();say('Đã đổi vé và gửi email QR mới.')}catch(e){say(e.message,true)}};
$('delete').onclick=async()=>{if(!confirm('Xóa đơn và trả ghế? Không thể hoàn tác.'))return;try{await call('/admin/orders/delete',{orderId:order.orderId});$('tool').hidden=true;say('Đã xóa đơn và trả ghế.')}catch(e){say(e.message,true)}};
$('cancelSeatsBtn').onclick=async()=>{const seatIdsToCancel=[...$('cancelSeats').querySelectorAll('input:checked')].map(x=>x.value);if(seatIdsToCancel.length===0){say('Chưa chọn ghế nào để huỷ.',true);return}if(!confirm(`Huỷ ${seatIdsToCancel.length} ghế (${seatIdsToCancel.join(', ')})? Tự tính lại tiền đơn, không thể hoàn tác. Tiền hoàn khách cần chuyển khoản tay ngoài hệ thống.`))return;try{const d=await call('/admin/orders/cancel-seats',{orderId:order.orderId,seatIdsToCancel});await lookup();say(`${d.message}. Tiền đơn còn lại: ${d.result.newAmount.toLocaleString('vi-VN')}đ. ${d.emailSent?'Đã gửi lại email vé mới cho khách.':'Email gửi thất bại — dùng nút "Gửi lại email vé" để thử lại.'} Nhớ hoàn tiền khách qua chuyển khoản tay nếu cần.`)}catch(e){say(e.message,true)}};
</script></body></html>
